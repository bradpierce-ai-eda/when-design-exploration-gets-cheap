<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="fig14-title fig14-desc">
<title id="fig14-title">Scarcity can move toward what AI doesn’t make easier</title>
<desc id="fig14-desc">Reducing the cost of one engineering activity shifts relative scarcity to other parts of the engineering process.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8.6,5 L1,9" fill="none" stroke="#AAB3BB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1200" height="700" rx="0" fill="#FCFBF8" stroke="none" stroke-width="1"/>
<text x="58" y="54" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#17212B" text-anchor="start">Scarcity can move toward what AI doesn’t make easier</text>
<text x="58" y="86" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D6973" text-anchor="start">Five independent examples of movement in relative scarcity</text>
