<text x="58" y="54" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#17212B" text-anchor="start">Governed interaction across separate ownership domains</text>
<text x="58" y="86" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D6973" text-anchor="start">External evaluation can contribute evidence without transferring customer technical capital</text>
