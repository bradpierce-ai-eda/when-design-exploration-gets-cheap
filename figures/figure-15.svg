<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1195" viewBox="0 0 2048 1195" role="img" aria-labelledby="fig15-title fig15-desc">
<title id="fig15-title">Three different questions about the same engineering system</title>
<desc id="fig15-desc">Control, dependence, and economic value can be distributed differently across the same system. A design organization can direct the workflow while relying on an external evaluator, with economic value distributed across several actors.</desc>
<rect width="2048" height="1195" fill="#FCFBF8"/>
<text x="98" y="92" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#17212B">Three different questions about the same engineering system</text>
