dth="1.5"/><text x="600" y="618" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17212B" text-anchor="middle">AUTONOMY MOVES FASTER WHERE USEFUL EVIDENCE IS CHEAP AND EXECUTABLE.</text><text x="600" y="646" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5D6973" text-anchor="middle">Expensive authoritative evidence becomes a selective escalation point rather than every-loop feedback.</text></svg>