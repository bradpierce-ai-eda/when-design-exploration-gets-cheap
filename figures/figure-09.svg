<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="fig09-title fig09-desc">
<title id="fig09-title">From experiment history to reusable engineering skill</title>
<desc id="fig09-desc">Evaluated engineering experience can become a reusable technical asset only when it is preserved together with the relevant design state, tool versions, constraints, decision authority, evidence, and assumptions. Whether that knowledge can transfer across organizations or produce durable business advantage remains unresolved.</desc>
<rect width="1400" height="850" fill="#FFFFFF"/>
