<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Agentic workflows can shift scarcity toward commitment</title>
<desc id="desc">A five-stage causal chain runs from generating alternatives through evaluation, filtering, exception review, and commitment. Qualitative cards show what can rise, what can fall or shift, and what remains a decision. A feedback loop records outcomes for the next batch.</desc>
<defs>
  <marker id="arrowFlow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#5D6973"/></marker>
  <marker id="arrowLearning" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#6B46C1"/></marker>
</defs>
<rect width="1400" height="850" fill="#FFFFFF"/>
<text x="70" y="58" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17212B">Agentic workflows can shift scarcity toward commitment</text>
<text x="70" y="91" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#5D6973">A common pattern: expand search, route evidence, review exceptions, and commit</text>
<line x1="70" y1="112" x2="1330" y2="112" stroke="#AAB6BF" stroke-width="1.5"/>
<rect x="70" y="180" width="220" height="105" rx="14" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="2"/><text x="180.0" y="236.5" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="180.0" dy="-11.5">Generate and screen</tspan><tspan x="180.0" dy="23">more alternatives</tspan></text><rect x="330" y="180" width="220" height="105" rx="14" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="2"/><text x="440.0" y="236.5" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="440.0" dy="-11.5">Invoke lower-cost</tspan><tspan x="440.0" dy="23">evaluators</tspan></text><rect x="590" y="180" width="220" height="105" rx="14" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="2"/><text x="700.0" y="236.5" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="700.0" dy="-11.5">Filter and escalate</tspan><tspan x="700.0" dy="23">selected cases</tspan></text><rect x="850" y="180" width="220" height="105" rx="14" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="2"/><text x="960.0" y="236.5" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="960.0" dy="-11.5">Review exceptions</tspan><tspan x="960.0" dy="23">and evidence</tspan></text><rect x="1110" y="180" width="220" height="105" rx="14" fill="#FFF1E8" stroke="#B56B3C" stroke-width="2"/><text x="1220.0" y="236.5" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="1220.0" dy="-11.5">Stop, choose, and</tspan><tspan x="1220.0" dy="23">own the outcome</tspan></text><line x1="298" y1="232" x2="342" y2="232" stroke="#5D6973" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowFlow)"/><line x1="558" y1="232" x2="602" y2="232" stroke="#5D6973" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowFlow)"/><line x1="818" y1="232" x2="862" y2="232" stroke="#5D6973" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowFlow)"/><line x1="1078" y1="232" x2="1122" y2="232" stroke="#5D6973" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowFlow)"/><rect x="70" y="350" width="375" height="148" rx="15" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="2"/><text x="257.5" y="385" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2F6B8A"><tspan x="257.5" dy="0.0">CAN RISE</tspan></text><text x="257.5" y="442" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="257.5" dy="-13.5">Proposal volume</tspan><tspan x="257.5" dy="27">Lower-cost evaluator calls</tspan></text><rect x="512" y="350" width="375" height="148" rx="15" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="2"/><text x="699.5" y="385" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5E7E6E"><tspan x="699.5" dy="0.0">CAN FALL OR SHIFT</tspan></text><text x="699.5" y="442" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="699.5" dy="-13.5">Manual tool operation</tspan><tspan x="699.5" dy="27">Unpromising downstream runs</tspan></text><rect x="954" y="350" width="375" height="148" rx="15" fill="#FFF1E8" stroke="#B56B3C" stroke-width="2"/><text x="1141.5" y="385" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#B56B3C"><tspan x="1141.5" dy="0.0">REMAINS A DECISION</tspan></text><text x="1141.5" y="442" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17212B"><tspan x="1141.5" dy="-13.5">When evidence is sufficient</tspan><tspan x="1141.5" dy="27">Which tradeoff to accept</tspan></text><rect x="300" y="555" width="800" height="76" rx="15" fill="#F0EBFA" stroke="#6B46C1" stroke-width="2"/><text x="700" y="588" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#6B46C1"><tspan x="700" dy="0.0">RETAIN OUTCOMES WITH THEIR EVIDENCE AND APPLICABILITY</tspan></text><text x="700" y="615" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17212B"><tspan x="700" dy="0.0">Usable experience can guide the next batch</tspan></text><path d="M1220 285 H1340 V593 H1115" fill="none" stroke="#6B46C1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLearning)"/><path d="M300 593 C155 593 95 500 95 300" fill="none" stroke="#6B46C1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLearning)"/><rect x="175" y="680" width="1050" height="92" rx="16" fill="#F7FAFC" stroke="#AAB6BF" stroke-width="1.5"/><text x="700" y="713" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#5D6973"><tspan x="700" dy="0.0">ENGINEERING JUDGMENT REMAINS</tspan></text><text x="700" y="748" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#17212B"><tspan x="700" dy="0.0">requirements · checkpoints · validation · evidence review · commitment</tspan></text><text x="700" y="820" text-anchor="middle" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#5D6973"><tspan x="700" dy="0.0">Effects vary by stage and implementation; stronger evidence may mean greater fidelity, authority, or both</tspan></text>
</svg>