<rect x="716" y="174" width="616" height="72" rx="36" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="2"/>
<text x="1024" y="220" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#5D6973" text-anchor="middle">Example distribution</text>

<rect x="98" y="280" width="561" height="808" rx="22" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="3"/>
