<line x1="706" y1="380" x2="1267" y2="380" stroke="#5E7E6E" stroke-width="2"/>
<line x1="1314" y1="380" x2="1875" y2="380" stroke="#B56B3C" stroke-width="2"/>

<text x="378.5" y="452" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17212B" text-anchor="middle"><tspan x="378.5" dy="0">Who sets the rules and</tspan><tspan x="378.5" dy="36">authorizes commitment?</tspan></text>
<text x="986.5" y="452" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17212B" text-anchor="middle"><tspan x="986.5" dy="0">Whose evaluator remains</tspan><tspan x="986.5" dy="36">necessary?</tspan></text>
<text x="1594.5" y="452" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17212B" text-anchor="middle"><tspan x="1594.5" dy="0">Who captures the value</tspan><tspan x="1594.5" dy="36">created by the system?</tspan></text>

