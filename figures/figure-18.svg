<text x="150" y="418" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">beats strong baseline</text>
<rect x="620" y="384" width="510" height="54" rx="9" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="1.5"/>
<text x="645" y="418" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="start">4</text>
<text x="680" y="418" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">repeated use</text>
