<text x="986.5" y="347" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="35" font-weight="800" fill="#5E7E6E" text-anchor="middle">DEPENDENCE</text>
<text x="1594.5" y="347" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="35" font-weight="800" fill="#B56B3C" text-anchor="middle">CAPTURE</text>
