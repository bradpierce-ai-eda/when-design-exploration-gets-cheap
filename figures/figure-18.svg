<text x="115" y="214" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#2F6B8A" text-anchor="start">1</text>
<text x="150" y="214" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">output</text>
<rect x="620" y="180" width="510" height="54" rx="9" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="1.5"/>
<text x="645" y="214" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="start">1</text>
<text x="680" y="214" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">demo / design partner</text>
<rect x="90" y="248" width="510" height="54" rx="9" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.5"/>
<text x="115" y="282" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#2F6B8A" text-anchor="start">2</text>
<text x="150" y="282" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">executable checks</text>
<rect x="620" y="248" width="510" height="54" rx="9" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="1.5"/>
<text x="645" y="282" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="start">2</text>
<text x="680" y="282" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">pilot</text>
<rect x="90" y="316" width="510" height="54" rx="9" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.5"/>
<text x="115" y="350" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#2F6B8A" text-anchor="start">3</text>
<text x="150" y="350" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">scoped functional correctness</text>
