<title id="fig03-title">Evaluator economics: what evidence should the engineering system buy next?</title>
<desc id="fig03-desc">Evaluator economics treats evaluation as a resource-allocation problem: which evidence to obtain next, when stronger evidence is worth its cost, when available evidence is sufficient, and when to stop or escalate. Different evaluators can be authoritative over different questions, so authority cannot be reduced to a single fidelity ladder.</desc><rect width="1200" height="720" fill="#FFFFFF"/><text x="60" y="62" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17212B">Evaluator economics: what evidence should the engineering system buy next?</text><rect x="55" y="115" width="250" height="330" rx="14" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="2"/><text x="180" y="145" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">CHEAP SCREEN</text><text x="69" y="178" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="start">COST</text><text x="215" y="178.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">low</text><text x="69" y="209" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="start">LATENCY</text><text x="215" y="209.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">fast</text><text x="69" y="240" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="start">COVERAGE</text><text x="215" y="240.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">broad</text><text x="69" y="271" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="start">FIDELITY</text><text x="215" y="271.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">limited</text><text x="69" y="302" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="start">DOMAIN OF AUTHORITY</text><text x="215" y="302.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">narrow</text><text x="69" y="333" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#5D6973" text-anchor="start">ERROR CONSEQUENCE</text><text x="215" y="333.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">low</text><text x="69" y="364" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#5D6973" text-anchor="start">DISTRIBUTION SENSITIVITY</text><text x="215" y="364.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">low</text><text x="69" y="395" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#5D6973" text-anchor="start">QUALIFICATION BURDEN</text><text x="215" y="395.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#17212B" text-anchor="start">light</text><rect x="335" y="115" width="250" height="330" rx="14" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="2"/><text x="460" y="145" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">TARGETED CHECK</text><text x="349" y="178" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="start">COST</text><text x="495" y="178.0" font-family="'Noto Sans', Arial, Helvetica, sans-seri