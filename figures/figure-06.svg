<title id="fig06-title">Separate capabilities before valuing companies</title>
<desc id="fig06-desc">AI-driven EDA already spans several markets. Different wedges act on different representations, evaluators, buyers, control points, compounding assets, and pressures toward platform integration or internalization by design organizations. Examples in the open/shared category include OpenROAD/CIRCT/XLS and iEDA/AiEDA.</desc><rect width="1200" height="720" fill="#FFFFFF"/><text x="60" y="62" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17212B">Separate capabilities before valuing companies</text><rect x="55" y="112" width="205" height="36" rx="5" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="1"/><text x="157.5" y="136" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="middle">CATEGORY</text><rect x="275" y="112" width="160" height="36" rx="5" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="1"/><text x="355.0" y="136" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="middle">PRIMARY ACTION</text><rect x="455" y="112" width="150" height="36" rx="5" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="1"/><text x="530.0" y="136" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="middle">EVALUATOR</text><rect x="625" y="112" width="145" height="36" rx="5" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="1"/><text x="697.5" y="136" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="middle">BUYER</text><rect x="790" y="112" width="160" height="36" rx="5" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="1"/><text x="870.0" y="136" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="middle">CONTROL POINT</text><rect x="970" y="112" width="170" height="36" rx="5" fill="#F7FAFC" stroke="#AAB3BB" s