<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="fig07-title fig07-desc">
<title id="fig07-title">Control can be split across the engineering loop</title>
<desc id="fig07-desc">Control of the agent–evaluator engineering loop can be distributed among multiple actors. Incumbent providers, design organizations, independent providers, and shared infrastructure can control different parts of the same engineering system. Independent markets persist when a capability is valuable enough to buy, difficult for design organizations to internalize, and uneconomic for incumbents to incorporate into broader platforms.</desc><rect width="1200" height="720" fill="#FFFFFF"/><text x="60" y="62" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17212B">Control can be split across the engineering loop</text><rect x="95" y="140" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="240" y="175.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">GOALS / INTENT</text><text x="240" y="222" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">CUSTOMER</text><rect x="455" y="140" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="600" y="175.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">PROPOSAL POLICY</text><text x="600" y="222" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">INDEPENDENT / HYBRID</text><rect x="815" y="140" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="960" y="175.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">EVALUATOR ACCESS</text><text x="960" y="222" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">INCUMBENT / SHARED</text><rect x="95" y="305" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="240" y="340.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">AUTHORITATIVE STATE</text><text x="240" y="387" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">CUSTOMER</text><rect x="455" y="305" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="600" y="340.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">EVIDENCE / SYSTEM OF</text><text x="600" y="358.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">RECORD</text><text x="600" y="387" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">CUSTOMER / HYBRID</text><rect x="815" y="305" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="960" y="332.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17212B" text-anchor="middle">ENGINEERING MEMORY /</text><text x="960" y="351.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17212B" text-anchor="middle">LEARNED SKILLS</text><text x="960" y="387" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">CUSTOMER / VENDOR</text><rect x="95" y="470" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="240" y="505.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">ROUTING / ESCALATION</text><text x="240" y="552" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">HYBRID</text><rect x="455" y="470" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="600" y="505.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">COMPUTE / TOKEN /</text><text x="600" y="523.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">LICENSE BUDGETS</text><text x="600" y="552" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">CUSTOMER / PLATFORM</text><rect x="815" y="470" width="290" height="105" rx="12" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.8"/><text x="960" y="505.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="middle">COMMITMENT / GOVERNANCE</text><text x="960" y="552" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6B46C1" text-anchor="middle">CUSTOMER</text><line x1="385" y1="192" x2="455" y2="192" stroke="#AAB3BB" stroke-width="2"/><polygon points="455,192 444.60769515458674,198.0 444.60769515458674,186.0" fill="#AAB3BB"/><line x1="745" y1="192" x2="815" y2="192" stroke="#AAB3BB" stroke-width="2"/><polygon points="815,192 804.6076951545867,198.0 804.6076951545867,186.0" fill="#AAB3BB"/><line x1="960" y1="245" x2="960" y2="305" stroke="#AAB3BB" stroke-width="2"/><polygon points="960,305 954.0,294.60769515458674 966.0,294.60769515458674" fill="#AAB3BB"/><line x1="815" y1="357" x2="745" y2="357" stroke="#AAB3BB" stroke-width="2"/><polygon points="745,357 755.3923048454133,351.0 755.3923048454133,363.0" fill="#AAB3BB"/><line x1="455" y1="357" x2="385" y2="357" stroke="#AAB3BB" stroke-width="2"/><polygon points="385,357 395.39230484541326,351.0 395.39230484541326,363.0" fill="#AAB3BB"/><line x1="240" y1="410" x2="240" y2="470" stroke="#AAB3BB" stroke-width="2"/><polygon points="240,470 234.0,459.60769515458674 246.0,459.60769515458674" fill="#AAB3BB"/><line x1="385" y1="522" x2="455" y2="522" stroke="#AAB3BB" stroke-width="2"/><polygon points="455,522 444.60769515458674,528.0 444.60769515458674,516.0" fill="#AAB3BB"/><line x1="745" y1="522" x2="815" y2="522" stroke="#AAB3BB" stroke-width="2"/><polygon points="815,522 804.6076951545867,528.0 804.6076951545867,516.0" fill="#AAB3BB"/><rect x="120" y="615" width="960" height="55" rx="10" fill="#F7FAFC" stroke="#AAB3BB" stroke-width="1.5"/><text x="600" y="641" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">CONTROL IS SPLITTABLE.</text><text x="600" y="663" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5D6973" text-anchor="middle">INCUMBENT BUNDLING  →  EXTERNAL MARKET WINDOW  ←  CUSTOMER INTERNALIZATION</text></svg>