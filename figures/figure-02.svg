<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="fig02-title fig02-desc">
<title id="fig02-title">A machine actor creates a learning loop around trusted evaluators</title>
<desc id="fig02-desc">The new actor is not automatically the judge. It proposes and adapts around executable tools and evaluators while humans still set goals, govern risk and budgets, decide when to escalate, and retain the right to commit.</desc>
