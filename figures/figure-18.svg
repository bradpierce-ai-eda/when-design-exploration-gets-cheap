<text x="345" y="130" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#2F6B8A" text-anchor="middle">TECHNICAL PROOF</text>
<text x="875" y="130" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="23" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="middle">COMMERCIAL PROOF</text>
