<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="fig12-title fig12-desc">
<title id="fig12-title">The same capability can favor different ownership structures</title>
<desc id="fig12-desc">The same capability can be owned and supplied in different ways as conditions change. Security, methodology importance, internal-build capacity, cross-vendor need, and willingness to share learning influence whether it is bought, built internally, integrated into a broader platform, shared, or kept private. Those choices also affect the economics of offering it as a standalone product.</desc><rect width="1200" height="720" fill="#FFFFFF"/><text x="60" y="62" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17212B">The same capability can favor different ownership structures</text><text x="357" y="126" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5D6973" text-anchor="middle">METHODOLOGY</text><text x="527" y="126" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5D6973" text-anchor="middle">SECURITY</text><text x="697" y="126" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5D6973" text-anchor="middle">BUILD CAPACITY</text><text x="867" y="126" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5D6973" text-anchor="middle">CROSS-VENDOR</text><text x="1037" y="126" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#5D6973" text-anchor="middle">LIKELY OWNERSHIP STRUCTURE</text><text x="55" y="171.0" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#17212B" text-anchor="start">Traditional</text><text x="55" y="186.6" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#17212B" text-anchor="start">semiconductor</text><rect x="285" y="150" width="145" height="38" rx="6" fill="#FFF1E8" stroke="#B56B3C" stroke-width="1"/><text x="357" y="175" font-family="'Noto Sans', Arial, Helvetica, sa