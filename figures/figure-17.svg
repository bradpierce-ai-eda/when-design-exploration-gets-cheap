<text x="614.0" y="188" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17212B" text-anchor="middle"><tspan x="614.0" dy="0">Governed</tspan><tspan x="614.0" dy="26.2">interface</tspan></text>
