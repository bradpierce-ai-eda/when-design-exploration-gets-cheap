<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="fig17-title fig17-desc">
<title id="fig17-title">Governed interaction across separate ownership domains</title>
<desc id="fig17-desc">Separately owned technical capital can still operate as one engineering system through a governed interface. Bounded context can pass to an external authoritative evaluator and evidence can return without transferring ownership of the underlying capital. In the figure, ‘customer-controlled’ refers to ownership and authority over the technical capital, not to where it is deployed.</desc>
