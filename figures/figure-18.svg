<text x="150" y="554" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">repeats across designs</text>
<rect x="620" y="520" width="510" height="54" rx="9" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="1.5"/>
<text x="645" y="554" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="start">6</text>
<text x="680" y="554" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">paid production</text>
<rect x="90" y="588" width="510" height="54" rx="9" fill="#EAF4FA" stroke="#2F6B8A" stroke-width="1.5"/>
<text x="115" y="622" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#2F6B8A" text-anchor="start">7</text>
<text x="150" y="622" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">transfers with manageable adaptation and requalification</text>
