<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="fig08-title fig08-desc">
<title id="fig08-title">Technical capital can be valuable without being suitable for external sale</title>
<desc id="fig08-desc">As capable foundation models become more widely available, durable advantage will depend even more on technical capital accumulated in design organizations, incumbent providers, foundries, ecosystems, and national programs. Much of that technical capital creates value primarily by improving the holder’s own engineering capability rather than by being sold separately.</desc>
