<text x="645" y="622" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="start">7</text>
<text x="680" y="622" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">expansion</text>
