<text x="115" y="486" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#2F6B8A" text-anchor="start">5</text>
<text x="150" y="486" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">survives downstream implementation</text>
<rect x="620" y="452" width="510" height="54" rx="9" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="1.5"/>
<text x="645" y="486" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" font-style="normal" fill="#5E7E6E" text-anchor="start">5</text>
<text x="680" y="486" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#17212B" text-anchor="start">measurable human / schedule value</text>
