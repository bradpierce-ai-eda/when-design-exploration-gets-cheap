<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="fig05-title fig05-desc">
<title id="fig05-title">Autonomy arrives where useful truth becomes cheap enough</title>
<desc id="fig05-desc">Model capability alone does not determine autonomy. A domain becomes easier to automate when useful evidence is cheap, executable, and authoritative enough for the decision being made.</desc><rect width="1200" height="720" fill="#FFFFFF"/><text x="60" y="62" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17212B">Autonomy arrives where useful truth becomes cheap enough</text><text x="327" y="122" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5D6973" text-anchor="middle">EVIDENCE COST</text><text x="502" y="122" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5D6973" text-anchor="middle">LATENCY</text><text x="677" y="122" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5D6973" text-anchor="middle">AUTHORITY</text><text x="852" y="116" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#5D6973" text-anchor="middle">ERROR</text><text x="852" y="130" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#5D6973" text-anchor="middle">CONSEQUENCE</text><text x="1027" y="116" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#5D6973" text-anchor="middle">SURROGATE</text><text x="1027" y="130" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#5D6973" text-anchor="middle">AVAILABILITY</text><text x="60" y="171" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17212B" text-anchor="start">verification / debug</text><rect x="255" y="145" width="145" height="38" rx="6" fill="#EDF5F0" stroke="#5E7E6E" stroke-width="1"/><text x="327" y="170" font-family="'Noto Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#17212